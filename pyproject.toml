[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-moment-crossover"
version = "0.0.0"
description = "Exact variance law and the crossover to collective measurement for shadow-based estimation of quantum state moments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "amesserlian" }]

# Abstract runtime dependencies (lower bounds). For a reproducible, mutually
# compatible environment, install the exact pins instead:
#     pip install -r requirements.txt
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "tqdm>=4.68",
]

[project.urls]
Repository = "https://github.com/alex-messerlian/shadow-moment-crossover"

[project.optional-dependencies]
dev = ["pytest>=9.1"]
# anrl.hardware imports qiskit and qiskit-aer at module level, so `import anrl.hardware`
# fails without this group -- as do the *_analysis.py scripts that recompute the paper's
# hardware numbers from the committed counts, and figure 6. openquantum-sdk and requests
# are needed only to SUBMIT jobs (anrl/hardware/submit.py, backend.py), not to re-analyse.
hardware = [
    "qiskit>=2.5",
    "qiskit-aer>=0.17",
    "openquantum-sdk>=0.3.7",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
include = ["anrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
