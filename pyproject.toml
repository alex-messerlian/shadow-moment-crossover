[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-moment-crossover"
version = "0.0.0"
description = "Exact variance law and the crossover to collective measurement for shadow-based estimation of quantum state moments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "amesserlian" }]

# Abstract runtime dependencies (lower bounds). For a reproducible, mutually
# compatible environment, install the exact pins instead:
#     pip install -r requirements.txt
# The torch / tensordict / torchrl trio is version-coupled — see requirements.txt.
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "torch>=2.12",
    "tensordict>=0.13",
    "torchrl>=0.13",
    "gymnasium>=1.3",
    "tqdm>=4.68",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.setuptools.packages.find]
include = ["anrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
